name: build

on:
  push:
    branches: [main]
    # A version tag (e.g. v1.0.0) also publishes both builds as a GitHub Release.
    tags: ['v*']

permissions:
  contents: read

env:
  # Same Node version the project was built and verified with locally.
  NODE_VERSION: '26.10.0'

jobs:
  check:
    runs-on: ubuntu-24.04
    # The Appwrite secrets live in the GitHub Environment "deployment"; only jobs that
    # name it can read them. Values are baked into the Vite bundle (see .env.example).
    environment: deployment
    env:
      VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT }}
      VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
      VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID }}
      VITE_APPWRITE_MESSAGES_TABLE_ID: ${{ secrets.VITE_APPWRITE_MESSAGES_TABLE_ID }}
      VITE_APPWRITE_PRESENCE_TABLE_ID: ${{ secrets.VITE_APPWRITE_PRESENCE_TABLE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Fail closed: Vite builds fine without these, but the app would refuse to start on the device.
      - name: Check Appwrite secrets are set
        run: |
          for name in VITE_APPWRITE_ENDPOINT VITE_APPWRITE_PROJECT_ID VITE_APPWRITE_DATABASE_ID \
                      VITE_APPWRITE_MESSAGES_TABLE_ID VITE_APPWRITE_PRESENCE_TABLE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing from the GitHub Environment \"deployment\" (Settings > Environments > deployment)."
              exit 1
            fi
          done
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run

  android:
    needs: check
    runs-on: ubuntu-24.04
    # The Appwrite secrets live in the GitHub Environment "deployment"; only jobs that
    # name it can read them. Values are baked into the Vite bundle (see .env.example).
    environment: deployment
    env:
      VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT }}
      VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
      VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID }}
      VITE_APPWRITE_MESSAGES_TABLE_ID: ${{ secrets.VITE_APPWRITE_MESSAGES_TABLE_ID }}
      VITE_APPWRITE_PRESENCE_TABLE_ID: ${{ secrets.VITE_APPWRITE_PRESENCE_TABLE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cordova/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # Versions required by cordova-android 15.1.0 (framework/cdv-gradle-config-defaults.json).
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.14.2'
          # Only used to put Gradle on PATH for Cordova. Caching is off: the cache key is hashed from
          # *.gradle files in the repo, and there are none — cordova/platforms/android is generated
          # during the build (git-ignored), so the cache step fails with "No file ... matched".
          cache-disabled: true
      - run: npm ci
      - run: npm ci
        working-directory: cordova
      - run: npm run android:build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: hypbridchat-android-debug
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  linux-deb:
    needs: check
    runs-on: ubuntu-24.04
    # The Appwrite secrets live in the GitHub Environment "deployment"; only jobs that
    # name it can read them. Values are baked into the Vite bundle (see .env.example).
    environment: deployment
    env:
      VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT }}
      VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
      VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID }}
      VITE_APPWRITE_MESSAGES_TABLE_ID: ${{ secrets.VITE_APPWRITE_MESSAGES_TABLE_ID }}
      VITE_APPWRITE_PRESENCE_TABLE_ID: ${{ secrets.VITE_APPWRITE_PRESENCE_TABLE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cordova/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: cordova
      - run: npm run linux:build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: hypbridchat-linux-deb
          path: cordova/platforms/electron/build/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux-deb]
    runs-on: ubuntu-24.04
    # Only this job may write to the repository (create the Release); every other job stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: hypbridchat-*
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            release-files/*.apk
            release-files/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
